plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hws.bot'
    compileSdk 34

    defaultConfig {
        applicationId "com.hws.bot"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Library untuk menjalankan Node.js di Android
    implementation 'com.janeasystems:nodejs-mobile-android:0.7.0'
}
